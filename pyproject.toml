[project]
name = "opportunity-hunter"
version = "0.1.0"
description = "Local-first personal app for the job & business-opportunity hunt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "claude-agent-sdk>=0.1.0",
    "numpy>=2.2.6",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "openai>=2.41.1",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
